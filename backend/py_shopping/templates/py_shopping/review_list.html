{% extends 'py_shopping/base.html' %}
{% block title %}Reviews{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Reviews</h1>
<div id="review-list" class="space-y-4"></div>
<script>
fetch('/api/shop/reviews/')
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById('review-list');
    if (data.length === 0) {
      container.innerHTML = '<p>No reviews available.</p>';
      return;
    }
    container.innerHTML = data.map(review => `
      <div class="bg-white rounded shadow p-4">
        <div class="flex justify-between items-center">
          <span class="font-semibold">${review.user || 'User'}</span>
          <span class="text-yellow-500">Rating: ${review.rating}/5</span>
        </div>
        <p class="text-gray-600 mt-2">${review.comment || ''}</p>
      </div>
    `).join('');
  });
</script>
{% endblock %}
