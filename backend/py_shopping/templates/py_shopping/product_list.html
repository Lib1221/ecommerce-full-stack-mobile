{% extends 'py_shopping/base.html' %}
{% block title %}Products{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Products</h1>
<div id="product-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
<script>
fetch('/api/shop/products/')
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById('product-list');
    if (data.length === 0) {
      container.innerHTML = '<p>No products available.</p>';
      return;
    }
    container.innerHTML = data.map(product => `
      <div class="bg-white rounded shadow p-4">
        <h2 class="text-lg font-semibold">${product.name}</h2>
        <p class="text-gray-600">${product.description || ''}</p>
        <p class="text-blue-600 font-bold mt-2">$${product.price}</p>
        <a href="#" class="text-blue-500 hover:underline mt-2 inline-block">View Details</a>
      </div>
    `).join('');
  });
</script>
{% endblock %}
