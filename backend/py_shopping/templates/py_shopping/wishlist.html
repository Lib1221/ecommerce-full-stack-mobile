{% extends 'py_shopping/base.html' %}
{% block title %}Wishlist{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Your Wishlist</h1>
<ul id="wishlist-list" class="space-y-4"></ul>
<script>
fetch('/api/shop/wishlist/')
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById('wishlist-list');
    if (data.length === 0) {
      container.innerHTML = '<li>Your wishlist is empty.</li>';
      return;
    }
    container.innerHTML = data.map(item => `
      <li class="bg-white rounded shadow p-4 flex justify-between items-center">
        <span>${item.product || ''}</span>
        <span class="text-blue-600 font-bold">$${item.price || ''}</span>
      </li>
    `).join('');
  });
</script>
{% endblock %}
